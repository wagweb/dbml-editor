  </style>
  <rect class="tile" width="32" height="32" rx="7.5"/>
  <g class="mark" stroke-width="2">
    <rect x="6.75" y="6.75" width="12.5" height="12.5" rx="3.25"/>
    <rect x="12.75" y="12.75" width="12.5" height="12.5" rx="3.25"/>
  </g>
  <rect class="core" x="12.75" y="12.75" width="6.5" height="6.5" rx="1"/>
</svg>
